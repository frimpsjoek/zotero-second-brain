<vbox id="second-brain-prefs"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml">
	<groupbox>
		<label><html:h2>Paper notes</html:h2></label>
		<html:p class="sb-pref-hint">Notes you write on a paper in Zotero are saved as Markdown as you type.</html:p>
		<radiogroup id="sb-notes-in">
			<radio value="auto" label="In Obsidian when Second Brain is running, otherwise in the folder below"/>
			<radio value="local" label="Always in the folder below"/>
		</radiogroup>
		<hbox align="center" class="sb-pref-row">
			<html:input id="sb-notes-folder" type="text" readonly="readonly" style="flex: 1"/>
			<button id="sb-notes-choose" label="Choose…"/>
			<button id="sb-notes-reveal" label="Show in Finder"/>
		</hbox>
		<html:p class="sb-pref-hint">Tip: choose a folder inside an Obsidian vault and the notes open there too, even without Second Brain.</html:p>
	</groupbox>
	<groupbox>
		<label><html:h2>Colors</html:h2></label>
		<html:p class="sb-pref-hint">By default the writing space uses Zotero's colors and follows light and dark mode.</html:p>
		<html:div id="sb-colors" class="sb-pref-colors"/>
	</groupbox>
	<groupbox>
		<label><html:h2>Search model</html:h2></label>
		<html:p class="sb-pref-hint">Finds similar papers and searches your library by meaning, right here on this computer, without Obsidian or the Second Brain server. One download of about 45 MB (snowflake-arctic-embed-s); your library never leaves this computer.</html:p>
		<hbox align="center" class="sb-pref-row">
			<button id="sb-model-download" label="Download"/>
			<button id="sb-model-remove" label="Remove"/>
			<html:span id="sb-model-state" class="sb-pref-hint"/>
		</hbox>
	</groupbox>
	<groupbox>
		<label><html:h2>Finding free PDFs</html:h2></label>
		<html:p class="sb-pref-hint">Use your own free keys so the PDF finder can ask Unpaywall and OpenAlex for open-access copies. Keys and email stay on this computer and are sent only to those two services.</html:p>
		<html:details class="sb-pref-guide" open="open">
			<html:summary>How to get your keys (about 2 minutes)</html:summary>
			<html:p><html:b>OpenAlex</html:b> (free; a key gives you 10× more lookups a day)</html:p>
			<html:ol>
				<html:li>Open the OpenAlex key page (button below) and create a free account, or sign in. It takes about 30 seconds.</html:li>
				<html:li>On <html:code>openalex.org/settings/api</html:code>, copy your API key.</html:li>
				<html:li>Paste it into <html:b>OpenAlex API key</html:b> below.</html:li>
			</html:ol>
			<hbox class="sb-pref-row">
				<button id="sb-open-openalex" label="Open OpenAlex key page"/>
				<button id="sb-open-openalex-docs" label="OpenAlex help"/>
			</hbox>
			<html:p><html:b>Unpaywall</html:b> (free; no sign-up)</html:p>
			<html:ol>
				<html:li>Type your email in <html:b>Email</html:b> below. That is all Unpaywall asks for; use a real address you read, as their terms request.</html:li>
				<html:li>Optional: Unpaywall now runs on OpenAlex's data and also accepts a key. Paste your OpenAlex key into <html:b>Unpaywall API key</html:b> and press <html:b>Test keys</html:b>. If it says "Invalid api_key", clear that field and the email is used instead.</html:li>
			</html:ol>
			<hbox class="sb-pref-row">
				<button id="sb-open-unpaywall" label="Unpaywall API page"/>
			</hbox>
			<html:p><html:b>Semantic Scholar</html:b> (free; without a key it often says "too many requests")</html:p>
			<html:ol>
				<html:li>Open the Semantic Scholar key form (button below), fill it in, and wait for the key by email.</html:li>
				<html:li>Paste it into <html:b>Semantic Scholar API key</html:b> below.</html:li>
			</html:ol>
			<hbox class="sb-pref-row">
				<button id="sb-open-s2" label="Semantic Scholar key form"/>
			</hbox>
			<html:p class="sb-pref-hint">arXiv, Crossref, Europe PMC (PubMed), bioRxiv and ChemRxiv need no key. Your email above makes Crossref faster.</html:p>
			<html:p class="sb-pref-hint">Then press <html:b>Test keys</html:b>: each service should say "works ✓". Nothing here is required. Without keys the PDF finder still tries arXiv, Semantic Scholar and Europe PMC.</html:p>
		</html:details>
		<hbox align="center" class="sb-pref-row">
			<label value="Email" style="min-width: 9em"/>
			<html:input id="sb-email" type="email" placeholder="you@university.edu" style="flex: 1"/>
		</hbox>
		<hbox align="center" class="sb-pref-row">
			<label value="OpenAlex API key" style="min-width: 9em"/>
			<html:input id="sb-openalex-key" type="password" placeholder="api_key" style="flex: 1"/>
		</hbox>
		<hbox align="center" class="sb-pref-row">
			<label value="Unpaywall API key" style="min-width: 9em"/>
			<html:input id="sb-unpaywall-key" type="password" placeholder="api_key (or leave empty and use the email)" style="flex: 1"/>
		</hbox>
		<hbox align="center" class="sb-pref-row">
			<label value="Semantic Scholar key" style="min-width: 9em"/>
			<html:input id="sb-s2-key" type="password" placeholder="x-api-key (optional)" style="flex: 1"/>
		</hbox>
		<hbox align="center" class="sb-pref-row">
			<button id="sb-keys-test" label="Test keys"/>
			<html:span id="sb-keys-state" class="sb-pref-hint"/>
		</hbox>
	</groupbox>
	<groupbox>
		<label><html:h2>Second Brain server</html:h2></label>
		<html:p class="sb-pref-hint">Optional. With it, notes sync with Obsidian and you get similar papers, notes that cite a paper, full-text search and the drive search for lost PDFs.</html:p>
		<hbox align="center" class="sb-pref-row">
			<label value="Obsidian vault" style="min-width: 7em"/>
			<html:input id="sb-vault" type="text" placeholder="Second-Brain" style="flex: 1"/>
		</hbox>
		<hbox align="center" class="sb-pref-row">
			<label value="Server address" style="min-width: 7em"/>
			<html:input id="sb-server" type="text" style="flex: 1"/>
			<html:span id="sb-server-state" class="sb-pref-hint"/>
		</hbox>
	</groupbox>
	<html:style>
		.sb-pref-hint { color: var(--fill-secondary); margin: 2px 0 6px; }
		.sb-pref-row { gap: 6px; margin: 4px 0; }
		.sb-pref-colors { display: grid; grid-template-columns: max-content 44px max-content; gap: 8px 12px; align-items: center; }
		.sb-pref-colors input[type=color] { width: 40px; height: 24px; padding: 0; border: 1px solid var(--fill-quinary); border-radius: 4px; }
		.sb-pref-colors .is-default { color: var(--fill-tertiary); }
		.sb-pref-guide { margin: 4px 0 10px; padding: 8px 12px; border: 1px solid var(--fill-quinary); border-radius: 6px; }
		.sb-pref-guide summary { cursor: pointer; font-weight: 600; }
		.sb-pref-guide ol { margin: 4px 0 6px; padding-inline-start: 1.4em; }
		.sb-pref-guide li { margin: 2px 0; }
		.sb-pref-guide p { margin: 8px 0 2px; }
	</html:style>
</vbox>
